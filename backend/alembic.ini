[alembic]
# Path to migration scripts, relative to the directory alembic is invoked from (backend/).
script_location = alembic

# Add backend/ to sys.path so `from app.core.config import settings` works in env.py.
prepend_sys_path = .

# Migration file naming: 2026_06_03_a1b2c3d4_add_employees.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# All generated SQL timestamps in UTC.
timezone = UTC
output_encoding = utf-8

# Alembic version table (stored in the target database).
version_table = alembic_version

# Overridden in env.py from DATABASE_URL environment variable.
sqlalchemy.url = postgresql+asyncpg://env_override


# ── Logging ────────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
