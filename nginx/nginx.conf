worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upload ceiling. Proof/photo uploads are validated to 10 MB in the backend; the
    # admin "restore from uploaded backup" endpoint needs headroom for a full .dump, so
    # the nginx ceiling is generous and the backend enforces the real per-endpoint limits.
    client_max_body_size 256m;

    # ── Rate-limit zones (keyed per client IP) ───────────────────────────────
    # login     : strict — brute-force / credential-stuffing defence on /auth/login
    # api       : generous global ceiling for the rest of the API
    # biometric : protects the unauthenticated ZKTeco webhook from event floods
    # Each conf.d server block opts in with `limit_req` on the matching location.
    # login rate kept modest but not so strict that an office sharing one NAT
    # locks itself out; burst absorbs honest retries.
    limit_req_zone $binary_remote_addr zone=login:10m     rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m       rate=30r/s;
    limit_req_zone $binary_remote_addr zone=biometric:10m rate=2r/s;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    # Security headers applied to all responses (frontend + backend).
    # Nginx is the single authoritative source for these — the backend does not
    # set them so there are no duplicate or conflicting values.
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # CSP is set here at proxy level so it covers both frontend and API responses.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;"
        always;

    include /etc/nginx/conf.d/*.conf;
}
