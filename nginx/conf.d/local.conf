# ── Tier 1: Local LAN deployment (HTTP only) ──────────────────────────
# Selected when DEPLOYMENT_MODE=local in .env
# Access: http://192.168.x.x from any device on the same WiFi/LAN

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

# Shared proxy settings for the backend, included by each API location below.
# Defined once here to keep the rate-limited locations DRY.

server {
    listen 80;
    server_name _;

    # Login — strict rate limit (brute-force defence). Must precede /api/.
    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        proxy_hide_header     X-Content-Type-Options;
        proxy_hide_header     X-Frame-Options;
        proxy_hide_header     X-XSS-Protection;
        proxy_hide_header     Referrer-Policy;
        proxy_hide_header     Content-Security-Policy;
    }

    # Biometric webhook — unauthenticated by protocol; rate-limit to blunt floods.
    location = /api/v1/attendance/biometric-event {
        limit_req zone=biometric burst=5 nodelay;
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        proxy_hide_header     X-Content-Type-Options;
        proxy_hide_header     X-Frame-Options;
        proxy_hide_header     X-XSS-Protection;
        proxy_hide_header     Referrer-Policy;
        proxy_hide_header     Content-Security-Policy;
    }

    # API — proxied to FastAPI backend
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        # Strip any security headers the backend already set so Nginx's
        # add_header directives (in nginx.conf http block) are the single
        # authoritative source — prevents duplicate header values on the client.
        proxy_hide_header     X-Content-Type-Options;
        proxy_hide_header     X-Frame-Options;
        proxy_hide_header     X-XSS-Protection;
        proxy_hide_header     Referrer-Policy;
        proxy_hide_header     Content-Security-Policy;
    }

    # MinIO media proxy — serves uploaded files (avatars, proof frames) publicly.
    # Objects under avatars/ have a public-read bucket policy set at startup.
    location /media/ {
        proxy_pass            http://minio:9000/;
        proxy_set_header      Host              minio:9000;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        # Strip MinIO-specific response headers that could confuse clients.
        proxy_hide_header     x-amz-id-2;
        proxy_hide_header     x-amz-request-id;
        proxy_hide_header     x-minio-deployment-id;
        proxy_read_timeout    30s;
    }

    # WHIP (WebRTC) signaling proxy to the mediamtx container. Lets the in-app
    # Camera page publish a webcam to the system same-origin (no browser CORS).
    # Only SDP signaling passes here; media flows peer-to-peer browser<->mediamtx.
    location /mediamtx/ {
        proxy_pass            http://mediamtx:8889/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering       off;
        proxy_read_timeout    30s;
    }

    # Frontend — proxied to Next.js (with WebSocket support for HMR in dev)
    location / {
        proxy_pass            http://frontend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    60s;
    }
}
