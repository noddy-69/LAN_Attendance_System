# ── Local LAN deployment — HTTPS mode ─────────────────────────────────
# Activated by: DEPLOYMENT_MODE=local-ssl  (set by setup-https.ps1)
# Certificates: nginx/certs/attendance.crt  +  nginx/certs/attendance.key
#               (generated by setup-https.ps1)
#
# HTTP (port 80) permanently redirects to HTTPS.
# HTTPS (port 443) terminates TLS and proxies to frontend + backend.
#
# Phones must trust the certificate once (see the Setup Guide) before the
# camera-based selfie check-in works over HTTPS.

upstream frontend_ssl {
    server frontend:3000;
    keepalive 32;
}

upstream backend_ssl {
    server backend:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # All HTTP traffic → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # mkcert-generated certificate (LAN IP + localhost)
    ssl_certificate     /etc/nginx/certs/attendance.crt;
    ssl_certificate_key /etc/nginx/certs/attendance.key;

    # Modern TLS — TLSv1.2 retained for older Android/Windows clients on LAN
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Session resumption — reduces handshake overhead for repeat connections
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 6 months; tells browsers to always use HTTPS for this origin
    # Remove on first deployment if you might roll back to HTTP.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass            http://backend_ssl;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      Connection        "";
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        proxy_hide_header     X-Content-Type-Options;
        proxy_hide_header     X-Frame-Options;
        proxy_hide_header     X-XSS-Protection;
        proxy_hide_header     Referrer-Policy;
        proxy_hide_header     Content-Security-Policy;
    }

    # ── MinIO media proxy ──────────────────────────────────────────────
    location /media/ {
        proxy_pass            http://minio:9000/;
        proxy_set_header      Host              minio:9000;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_hide_header     x-amz-id-2;
        proxy_hide_header     x-amz-request-id;
        proxy_hide_header     x-minio-deployment-id;
        proxy_read_timeout    30s;
    }

    # ── WHIP (WebRTC) signaling proxy to the mediamtx container. The in-app webcam
    # (Admin → Camera) publishes here; media (ICE/UDP) flows browser↔mediamtx directly.
    location /mediamtx/ {
        proxy_pass            http://mediamtx:8889/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering       off;
        proxy_read_timeout    30s;
    }

    # ── Frontend ───────────────────────────────────────────────────────
    location / {
        proxy_pass            http://frontend_ssl;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    60s;
    }
}
